<!DOCTYPE html>
<html lang="bn">
<head>
    <meta name="google-site-verification" content="4N8i_4LwykZneRvpzBpVfld2BEagPFLueB3_t5eQ704" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <!-- Security Header -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>RK LIVE TV - Premium Streaming</title>
    
    <!-- HLS & YouTube API -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        /* Base Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        body { 
            background-color: #0b0b0f; 
            color: #ffffff; 
            overflow-x: hidden; 
            width: 100%; 
            -webkit-tap-highlight-color: transparent; 
        }

        :focus { outline: none !important; box-shadow: none !important; }

        /* TV Focus Mode */
        .tv-mode .tv-focusable:focus { outline: 3px solid #00d2ff !important; box-shadow: 0 0 15px #00d2ff !important; transform: scale(1.05); z-index: 100; border-radius: 8px; transition: all 0.2s ease; }
        .tv-mode .channel-card:focus, .tv-mode .event-card:focus { border-color: #00d2ff !important; background: #22222a !important; box-shadow: 0 0 20px rgba(0, 210, 255, 0.5) !important; transform: scale(1.08); }
        .tv-mode .control-btn:focus, .tv-mode .play-pause-btn:focus { outline: 3px solid #ff0055 !important; box-shadow: 0 0 15px #ff0055 !important; background: rgba(255, 0, 85, 0.3) !important; }

        /* =========================================
           STICKY HEADER & VIDEO WRAPPER 
           ========================================= */
        .sticky-header-video { 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            width: 100%; 
            background: #0b0b0f; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.8); 
            border-bottom: 1px solid #1f1f25;
        }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 10px 15px; background-color: #0f0f13; border-bottom: 1px solid #1f1f25; width: 100%; gap: 10px; }
        .logo-time-container { display: flex; align-items: center; justify-content: flex-start; gap: 10px; width: auto; flex-wrap: nowrap; }
        
        .logo-wrapper { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .logo-text { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 4px; letter-spacing: 1px; }
        .logo-text span.live { color: #ff0055; }
        .logo-text span.tv { background-color: #00d2ff; color: #000; padding: 2px 6px; border-radius: 6px; font-size: 14px; font-weight: bold; }

        /* Animated Header Logo */
        .loader {
            --color-one: #ffbf48; --color-two: #be4a1d; --color-three: #ffbf4780; --color-four: #bf4a1d80; --color-five: #ffbf4740;
            --time-animation: 2s; position: relative; border-radius: 50%; transform: scale(0.3); margin-right: -32px; margin-left: -32px;
            box-shadow: 0 0 25px 0 var(--color-three), 0 20px 50px 0 var(--color-four);
            animation: colorize calc(var(--time-animation) * 3) ease-in-out infinite;
        }
        .loader::before { content: ""; position: absolute; top: 0; left: 0; width: 100px; height: 100px; border-radius: 50%; border-top: solid 1px var(--color-one); border-bottom: solid 1px var(--color-two); background: linear-gradient(180deg, var(--color-five), var(--color-four)); }
        .loader .box { width: 100px; height: 100px; background: linear-gradient(180deg, var(--color-one) 30%, var(--color-two) 70%); }
        .loader svg { position: absolute; top:0; left:0;}
        .loader svg mask { filter: contrast(15); animation: roundness calc(var(--time-animation) / 2) linear infinite; }
        .loader svg mask polygon { filter: blur(7px); }
        .loader svg mask polygon:nth-child(1) { transform-origin: 75% 25%; transform: rotate(90deg); }
        .loader svg mask polygon:nth-child(2) { transform-origin: 50% 50%; animation: rotation var(--time-animation) linear infinite reverse; }
        .loader svg mask polygon:nth-child(3) { transform-origin: 50% 60%; animation: rotation var(--time-animation) linear infinite; }
        .loader svg mask polygon:nth-child(4) { transform-origin: 40% 40%; animation: rotation var(--time-animation) linear infinite reverse; }
        .loader svg mask polygon:nth-child(6) { transform-origin: 60% 40%; animation: rotation var(--time-animation) linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes roundness { 0%, 100% { filter: contrast(15); } 20%, 40% { filter: contrast(3); } 60% { filter: contrast(15); } }
        @keyframes colorize { 0%, 100% { filter: hue-rotate(0deg); } 20% { filter: hue-rotate(-30deg); } 40% { filter: hue-rotate(-60deg); } 60% { filter: hue-rotate(-90deg); } 80% { filter: hue-rotate(-45deg); } }

        /* Flip Clock Mini */
        .clock-wrapper { display: flex; flex-direction: row; align-items: center; gap: 5px; }
        .date-display { font-size: 8px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; background: #1a1a21; padding: 3px 6px; border-radius: 12px; border: 1px solid #333; }
        .date-display .day { color: #00d2ff; margin-right: 2px; }
        .date-display .date { color: #ffffff; }

        .flip-clock { display: flex; gap: 2px; align-items: center; font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        .flip-unit { position: relative; width: 16px; height: 22px; background: #16161a; border-radius: 3px; font-size: 12px; color: #00d2ff; border: 1px solid #333; }
        .flip-top, .flip-bottom, .flip-flap-top, .flip-flap-bottom { position: absolute; left: 0; width: 100%; height: 11px; background: #22222a; overflow: hidden; backface-visibility: hidden; }
        .flip-top { top: 0; border-radius: 3px 3px 0 0; }
        .flip-bottom { bottom: 0; border-radius: 0 0 3px 3px; }
        .flip-flap-top { top: 0; transform-origin: bottom; animation: flipTop 0.3s ease-in forwards; z-index: 2; }
        .flip-flap-bottom { bottom: 0; transform-origin: top; transform: rotateX(90deg); animation: flipBottom 0.3s ease-out 0.3s forwards; z-index: 2; }
        .flip-unit span { position: absolute; left: 0; width: 100%; height: 22px; line-height: 22px; text-align: center; display: block; }
        .flip-top span, .flip-flap-top span { top: 0; }
        .flip-bottom span, .flip-flap-bottom span { top: -11px; }
        .flip-unit::after { content: ''; position: absolute; left: 0; top: 11px; width: 100%; height: 1px; background: rgba(0, 0, 0, 0.8); z-index: 5; margin-top: -0.5px;}
        .flip-ampm { font-size: 10px; color: #ff0055; margin-left: 2px; font-family: 'Segoe UI', Tahoma, sans-serif; font-weight: 900; }

        @keyframes flipTop { 0% { transform: rotateX(0deg); } 100% { transform: rotateX(-90deg); } }
        @keyframes flipBottom { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0deg); } }

        .search-container { position: relative; flex-grow: 1; max-width: 250px; }
        .search-box { background: #16161a; border: 1px solid #2c2c35; color: white; padding: 8px 15px 8px 30px; border-radius: 15px; outline: none; width: 100%; font-size: 12px; transition: 0.3s; }
        .search-box:focus { border-color: #00d2ff !important; }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: 0.6; pointer-events: none; }

        /* Video Player & Overlays (Compact/Flat Size for PC) */
        .video-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 800px; /* ভিডিওর সর্বোচ্চ চওড়া মাপ */
            max-height: 45vh; /* ভিডিওর উচ্চতা কমিয়ে দেওয়া হয়েছে যাতে চ্যানেলগুলো ভালো দেখা যায় */
            margin: 0 auto; /* প্লেয়ারটিকে সেন্টারে রাখার জন্য */
            aspect-ratio: 16/9; 
            background: #000; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
        }
        video { width: 100%; height: 100%; outline: none; display: block; transition: object-fit 0.3s ease; }
        
        #youtube-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; display: none; background: #000; overflow: hidden; }
        #youtube-container iframe { width: 100%; height: 100%; border: none; transition: transform 0.3s ease; transform-origin: center; pointer-events: auto; }
        
        #yt-overlay-click { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 45; display: none; cursor: pointer; }
        #ad-shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 48; display: none; background: transparent; cursor: pointer; }

        #video-watermark { position: absolute; top: 15px; right: 15px; z-index: 55; display: none; align-items: center; gap: 5px; font-size: 16px; font-weight: 800; letter-spacing: 1px; color: rgba(255, 255, 255, 0.4); pointer-events: none; user-select: none; text-shadow: 0px 1px 3px rgba(0,0,0,0.8); }
        #video-watermark span.live { color: rgba(255, 0, 85, 0.6); }
        #video-watermark span.tv { background-color: rgba(0, 210, 255, 0.4); color: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; font-size: 12px; }

        #match-countdown-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0f; z-index: 45; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; border: 2px solid #222; }
        .mc-brand { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
        .mc-brand .rk { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .mc-brand .live { color: #ff0055; text-shadow: 0 0 15px rgba(255,0,85,0.8); }
        .mc-brand .tv { background-color: #00d2ff; color: #000; padding: 2px 8px; border-radius: 8px; font-size: 16px; box-shadow: 0 0 15px rgba(0,210,255,0.8); }
        #mc-logo { height: 50px; margin-bottom: 10px; object-fit: contain; }
        #mc-title { color: #00a8ff; font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        #mc-timer { font-size: 30px; font-weight: bold; font-family: monospace; color: #e74c3c; background: #000; padding: 5px 20px; border-radius: 8px; border: 1px solid #333; letter-spacing: 2px; }
        #mc-status { margin-top: 10px; font-weight: bold; font-size: 14px; }

        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #00d2ff; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none; border: 1px solid #00d2ff; }
        .toast.show { opacity: 1; }

        #brightness-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; opacity: 0; pointer-events: none; z-index: 35; transition: opacity 0.1s; }
        .swipe-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 15px 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 65; opacity: 0; transition: opacity 0.2s; pointer-events: none; border: 1px solid #444; }
        .swipe-indicator.show { opacity: 1; }
        .swipe-indicator svg { width: 35px; height: 35px; fill: white; }
        .swipe-bar { width: 100px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 5px;}
        .swipe-progress { height: 100%; background: #00d2ff; width: 50%; }
        .swipe-percent { color: white; font-size: 14px; font-weight: bold; }

        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0f; z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.3s; }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .player-logo-anim { display: flex; align-items: center; gap: 8px; font-size: 30px; font-weight: 900; letter-spacing: 2px; animation: pulseLogo 1s infinite alternate; }
        .player-logo-anim .rk-text { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .player-logo-anim .live-text { color: #ff0055; text-shadow: 0 0 15px rgba(255,0,85,0.8); }
        .player-logo-anim .tv-text { background-color: #00d2ff; color: #000; padding: 2px 8px; border-radius: 8px; font-size: 22px; box-shadow: 0 0 15px rgba(0,210,255,0.8); }
        .loading-text { margin-top: 15px; color: #00d2ff; font-size: 12px; letter-spacing: 3px; font-weight: bold; animation: blink 1s infinite; }

        @keyframes pulseLogo { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Controls UI */
        .player-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 75%, rgba(0,0,0,0.8) 100%); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 60;}
        .player-controls.active { opacity: 1; pointer-events: auto; }
        
        .controls-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .controls-top .left, .controls-top .right { display: flex; gap: 10px; align-items: center; }
        .control-btn { background: none; border: none; color: white; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; border-radius: 50%; outline: none; }
        .control-btn svg { width: 28px; height: 28px; fill: white; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8)); transition: 0.2s; }
        .control-btn:hover svg { fill: #00d2ff; }

        .controls-bottom { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .buttons-bottom { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; }
        .bottom-left-btns { display: flex; gap: 10px; align-items: center; }
        
        .center-controls { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 30px; align-items: center; }
        .play-pause-btn { width: 60px; height: 60px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid rgba(255,255,255,0.7); transition: transform 0.2s; outline: none;}
        .play-pause-btn svg { width: 30px; height: 30px; fill: white; margin-left: 4px; }
        .play-pause-btn:active { transform: scale(0.9); }

        .progress-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 13px; font-weight: bold; text-shadow: 1px 1px 3px black; }
        .progress-bar { flex-grow: 1; -webkit-appearance: none; appearance: none; height: 4px; background: rgba(255, 255, 255, 0.3); border-radius: 5px; outline: none; cursor: pointer; pointer-events: none;}
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00d2ff; cursor: pointer; box-shadow: 0 0 5px rgba(0,210,255,0.8); }

        /* LOCK SCREEN BEHAVIOR */
        .video-wrapper.locked .player-controls { background: transparent !important; }
        .video-wrapper.locked .controls-top .left, 
        .video-wrapper.locked .controls-bottom, 
        .video-wrapper.locked .center-controls { display: none !important; }
        .video-wrapper.locked .controls-top .right .control-btn:not(#btn-lock) { display: none !important; }

        /* Other Web Layout */
        .notice-container { display: flex; align-items: center; background: #131318; border-bottom: 1px solid #222; }
        .notice-badge { background: linear-gradient(90deg, #ff0055, #ff0000); color: white; padding: 6px 15px; font-size: 13px; font-weight: bold; border-radius: 20px; margin: 5px 10px; white-space: nowrap; z-index: 2; box-shadow: 0 0 10px rgba(255,0,0,0.4); }
        .notice-marquee { color: #00d2ff; font-size: 14px; padding-right: 10px; }

        .filter-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 12px 15px; background-color: #0b0b0f; border-bottom: 1px solid #1a1a21; gap: 10px; }
        .filter-container h3 { font-size: 15px; color: #fff; font-weight: bold; margin: 0; }
        .category-select { background: #16161a; color: #00d2ff; border: 1px solid #2c2c35; padding: 8px 15px; border-radius: 20px; outline: none; font-size: 13px; font-weight: bold; cursor: pointer; }

        /* Horizontal Slider for Channels (Drag to scroll enabled) */
        .channel-scroll-container { 
            display: flex; flex-wrap: nowrap; overflow-x: auto; padding: 20px 15px; gap: 15px; 
            background: #0b0b0f; scroll-behavior: smooth; scrollbar-width: none; 
            cursor: grab; /* পিসিতে মাউস পয়েন্টার হাতের মতো দেখাবে */
        }
        .channel-scroll-container:active { cursor: grabbing; } /* ক্লিক করে ড্র্যাগ করার সময় */
        .channel-scroll-container::-webkit-scrollbar { display: none; } 
        
        .channel-card, .event-card { flex: 0 0 auto; width: 130px; background: #1a1a21; border-radius: 12px; padding: 10px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; outline: none; position: relative;}
        .channel-card.active, .event-card.active { border-color: #00d2ff; background: #22222a; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        .channel-card img, .event-card img { width: 100%; height: 70px; object-fit: contain; background: #ffffff; border-radius: 8px; margin-bottom: 10px; padding: 4px; pointer-events: none; /* ড্র্যাগ করার সময় ইমেজ যেন সমস্যা না করে */}
        .channel-card p, .event-card p { font-size: 13px; text-align: center; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; font-weight: bold; pointer-events: none;}
        .event-badge { position: absolute; top: 0; right: 0; background: #e74c3c; color: white; font-size: 9px; font-weight: bold; padding: 3px 6px; border-radius: 0 10px 0 10px; animation: blink 1.5s infinite; }

        .playstore-btn { display: none; background: #000; color: white; margin: 20px auto; max-width: 300px; text-decoration: none; border-radius: 10px; border: 1px solid #444; padding: 10px 20px; align-items: center; gap: 15px; transition: 0.3s; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); outline: none; justify-content: center; }
        .playstore-btn:hover, .playstore-btn:focus { background: #111; border-color: #00d2ff; }
        .playstore-btn svg { width: 35px; height: 35px; }
        .playstore-text { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
        .playstore-text span:first-child { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        .playstore-text span:last-child { font-size: 18px; font-weight: bold; }

        .ad-container { width: 100%; display: none; justify-content: center; align-items: center; margin: 10px 0; min-height: 60px; overflow: hidden; background: #0f0f13; }
        
        /* Category Title for Playlists */
        .cat-title-wrap { background: #111a22; padding: 8px 15px; border-left: 4px solid #00d2ff; margin-top: 15px; }
        .cat-title-wrap h4 { margin: 0; font-size: 15px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

        /* Responsive UI for PC / Tablets */
        @media (min-width: 768px) {
            .channel-card, .event-card { width: 160px; padding: 15px; } 
            .channel-card img, .event-card img { height: 90px; }
            .channel-card p, .event-card p { font-size: 14px; }
            .filter-container h3 { font-size: 18px; }
            .search-container { max-width: 300px; }
        }

        @media (max-width: 600px) {
            .navbar { justify-content: space-between; padding: 8px 10px; }
            .logo-time-container { width: 100%; gap: 5px; justify-content: space-between; }
            .search-container { max-width: 100%; width: 100%; }
            .channel-card, .event-card { width: 110px; } .channel-card img, .event-card img { height: 60px; }
            #video-watermark { top: 10px; right: 10px; font-size: 12px; }
            #video-watermark span.tv { font-size: 10px; padding: 1px 4px; }
            .video-wrapper { max-height: none; } /* মোবাইলে সাধারণ হাইট থাকবে */
        }
    </style>
</head>
<body>

    <div class="sticky-header-video">
        <header class="navbar">
            <div class="logo-time-container">
                <div class="logo-wrapper tv-focusable" tabindex="0" onclick="window.location.href='/'">
                    <div class="loader loader-header">
                        <svg width="100" height="100" viewBox="0 0 100 100"><defs><mask id="clip-header"><polygon points="0,0 100,0 100,100 0,100" fill="black"></polygon><polygon points="25,25 75,25 50,75" fill="white"></polygon><polygon points="50,25 75,75 25,75" fill="white"></polygon><polygon points="35,35 65,35 50,65" fill="white"></polygon><polygon points="35,35 65,35 50,65" fill="white"></polygon><polygon points="35,35 65,35 50,65" fill="white"></polygon><polygon points="35,35 65,35 50,65" fill="white"></polygon></mask></defs></svg>
                        <div class="box" style="mask: url(#clip-header); -webkit-mask: url(#clip-header);"></div>
                    </div>
                    <div class="logo-text">RK <span class="live">LIVE</span> <span class="tv">TV</span></div>
                </div>

                <div class="clock-wrapper">
                    <div class="date-display" id="date-display">
                        <span class="day">--</span> <span class="date">-- -- ----</span>
                    </div>
                    
                    <div class="flip-clock" id="clock-display">
                        <div class="flip-unit" id="flip-h" data-value="00">
                            <div class="flip-top"><span>00</span></div><div class="flip-bottom"><span>00</span></div>
                            <div class="flip-flap-top"><span>00</span></div><div class="flip-flap-bottom"><span>00</span></div>
                        </div>:
                        <div class="flip-unit" id="flip-m" data-value="00">
                            <div class="flip-top"><span>00</span></div><div class="flip-bottom"><span>00</span></div>
                            <div class="flip-flap-top"><span>00</span></div><div class="flip-flap-bottom"><span>00</span></div>
                        </div>:

    <script>
        // Security logic
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        };

        const FIREBASE_DB_URL = "https://my-digital-store-917ee-default-rtdb.firebaseio.com";

        let allCustomChannels = [], allEvents = [], allPlaylistChannels = [], isInitialLoad = true;
        let currentStreamType = 'm3u8'; 
        let ytPlayer = null; 
        let isMouseDragging = false; // পিসিতে স্লাইড করার সময় ক্লিক ব্লক করার জন্য

        // Drag to scroll logic for PC/TV mouse users
        function attachDragToScroll() {
            const sliders = document.querySelectorAll('.channel-scroll-container');
            sliders.forEach(slider => {
                if (slider.dataset.dragAttached) return;
                slider.dataset.dragAttached = 'true';

                let isDown = false; let startX; let scrollLeft;

                slider.addEventListener('mousedown', (e) => {
                    isDown = true; isMouseDragging = false;
                    slider.style.scrollBehavior = 'auto'; // স্লাইডের সময় স্মুথনেস অফ করা
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });

                slider.addEventListener('mouseleave', () => { isDown = false; slider.style.scrollBehavior = 'smooth'; });
                
                slider.addEventListener('mouseup', () => { 
                    isDown = false; slider.style.scrollBehavior = 'smooth'; 
                    setTimeout(() => isMouseDragging = false, 50); // মাউস ছাড়ার পর অল্প সময় ক্লিক ব্লক রাখা
                });

                slider.addEventListener('mousemove', (e) => {
                    if(!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 2; // স্লাইড স্পিড (২ গুন ফাস্ট)
                    if (Math.abs(walk) > 5) isMouseDragging = true; // যদি ৫ পিক্সেলের বেশি নড়ে তবেই ড্র্যাগ কাউন্ট হবে
                    slider.scrollLeft = scrollLeft - walk;
                });
            });
        }

        // 1. Visitor Tracking (REST API - No connection limits)
        async function logVisitorREST() {
            const d = new Date();
            const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Dhaka', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
            if(localStorage.getItem('visited_today') !== todayStr) {
                try {
                    let res = await fetch(`${FIREBASE_DB_URL}/analytics/visitors/${todayStr}.json`);
                    let current = await res.json() || 0;
                    await fetch(`${FIREBASE_DB_URL}/analytics/visitors/${todayStr}.json`, {
                        method: 'PUT',
                        body: JSON.stringify(current + 1)
                    });
                    localStorage.setItem('visited_today', todayStr);
                } catch(e) { console.error("Visitor logging failed"); }
            }
        }
        window.onload = function() { logVisitorREST(); };

        function onYouTubeIframeAPIReady() { }

        // Clock Logic
        function updateFlip(id, val) {
            const el = document.getElementById(id); const current = el.getAttribute('data-value');
            if (current === val) return; el.setAttribute('data-value', val);
            el.innerHTML = `<div class="flip-top"><span>${val}</span></div><div class="flip-bottom"><span>${val}</span></div><div class="flip-flap-top"><span>${current}</span></div><div class="flip-flap-bottom"><span>${val}</span></div>`;
        }
        const daysList = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const monthsList = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        function updateClock() {
            const now = new Date(); let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds(); const ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12; h = h ? h : 12; 
            updateFlip('flip-h', h.toString().padStart(2, '0')); updateFlip('flip-m', m.toString().padStart(2, '0')); updateFlip('flip-s', s.toString().padStart(2, '0'));
            document.getElementById('flip-ampm').innerText = ampm;
            document.getElementById('date-display').innerHTML = `<span class="day">${daysList[now.getDay()]},</span> <span class="date">${now.getDate()} ${monthsList[now.getMonth()]} ${now.getFullYear()}</span>`;
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. Data Fetching (100% REST API to bypass 60k limit)
        async function fetchFirebaseData() {
            try {
                // Fetching everything in parallel without holding any websocket connections!
                const [channelsRes, settingsRes, eventsRes, m3uRes] = await Promise.all([
                    fetch(`${FIREBASE_DB_URL}/channels.json`), 
                    fetch(`${FIREBASE_DB_URL}/settings.json`), 
                    fetch(`${FIREBASE_DB_URL}/liveEvents.json`),
                    fetch(`${FIREBASE_DB_URL}/m3uData/channels.json`) // New synced M3U Data
                ]);
                
                const channelsObj = await channelsRes.json(); 
                const settingsObj = await settingsRes.json(); 
                const eventsObj = await eventsRes.json(); 
                const m3uObj = await m3uRes.json();

                // Live Events
                allEvents = []; 
                if (eventsObj) { 
                    Object.keys(eventsObj).forEach(key => allEvents.push({ id: key, ...eventsObj[key] })); 
                    allEvents.sort((a, b) => (a.order || 0) - (b.order || 0)); 
                } 
                renderEvents();
                
                // Custom Channels
                allCustomChannels = [];
                if (channelsObj) {
                    Object.keys(channelsObj).forEach(key => {
                        allCustomChannels.push({ id: key, ...channelsObj[key] });
                    });
                    allCustomChannels.sort((a, b) => (a.order || 0) - (b.order || 0));
                }
                renderCustomChannels();

                // M3U Playlist Channels (Admin Synced)
                allPlaylistChannels = [];
                if (m3uObj) {
                    Object.keys(m3uObj).forEach(key => {
                        allPlaylistChannels.push({ id: key, ...m3uObj[key] });
                    });
                    allPlaylistChannels.sort((a, b) => (a.order || 0) - (b.order || 0));
                }
                renderPlaylistChannels();

                // Autoplay Initial
                if (isInitialLoad) {
                    if (allEvents.length > 0) playMatch(allEvents[0].id); 
                    else if (allCustomChannels.length > 0) playVideo(allCustomChannels[0].url, allCustomChannels[0].id, allCustomChannels[0].type || 'm3u8');
                    else if (allPlaylistChannels.length > 0) playVideo(allPlaylistChannels[0].url, allPlaylistChannels[0].id, 'm3u8');
                    isInitialLoad = false;
                }

                // Apply Settings
                if (settingsObj) {
                    document.getElementById('user-notice').textContent = settingsObj.notice || "Welcome to RK LIVE TV!";
                    const btn = document.getElementById('app-download-btn');
                    if (settingsObj.appUrl && settingsObj.appUrl.trim() !== "") { btn.href = settingsObj.appUrl; btn.style.display = 'flex'; } else btn.style.display = 'none';

                    if (settingsObj.ads) {
                        const ad = settingsObj.ads;
                        const b1 = document.getElementById('ad-banner-1'); if(ad.banner1 && ad.banner1.status === 'enabled') { b1.style.display = 'flex'; b1.innerHTML = ad.banner1.code; } else b1.style.display = 'none';
                        const b2 = document.getElementById('ad-banner-2'); if(ad.banner2 && ad.banner2.status === 'enabled') { b2.style.display = 'flex'; b2.innerHTML = ad.banner2.code; } else b2.style.display = 'none';
                        const p = document.getElementById('popup-ads-container'); p.innerHTML = ''; 
                        if(ad.popup1 && ad.popup1.status === 'enabled') p.innerHTML += ad.popup1.code;
                        if(ad.popup2 && ad.popup2.status === 'enabled') p.innerHTML += ad.popup2.code;
                    }
                }
            } catch (error) { console.error("Data Fetch Error:", error); }
        }
        
        fetchFirebaseData(); 
        setInterval(fetchFirebaseData, 180000); // Reload data every 3 mins

        // UI & Player Variables
        const video = document.getElementById('video-player'); const videoContainer = document.getElementById('videoContainer');
        const playerControls = document.getElementById('playerControls'); const youtubeContainer = document.getElementById('youtube-container');
        const ytOverlayClick = document.getElementById('yt-overlay-click'); const loadingOverlay = document.getElementById('loading-overlay');
        const brightnessOverlay = document.getElementById('brightness-overlay'); const btnPlayPause = document.getElementById('btn-playpause');
        const iconPlay = document.getElementById('icon-play'); const toastMsg = document.getElementById('toast-msg');
        const videoWatermark = document.getElementById('video-watermark');
        const adShield = document.getElementById('ad-shield');

        function hideWatermark() { videoWatermark.style.display = 'none'; }
        function showWatermark() { videoWatermark.style.display = 'flex'; }
        function showToast(msg) { toastMsg.innerText = msg; toastMsg.classList.add('show'); setTimeout(() => toastMsg.classList.remove('show'), 2500); }

        let isControlsVisible = false; let controlTimeout;
        const hideControls = () => { playerControls.classList.remove('active'); isControlsVisible = false; clearTimeout(controlTimeout); };
        const showControls = () => { if(!loadingOverlay.classList.contains('hidden') && document.getElementById('match-countdown-container').style.display !== 'flex') return; playerControls.classList.add('active'); isControlsVisible = true; resetControlTimer(); };
        const resetControlTimer = () => { clearTimeout(controlTimeout); controlTimeout = setTimeout(hideControls, 3000); };

        adShield.addEventListener('click', function(e) {
            e.stopPropagation();
            this.style.display = 'none'; 
            showToast("🛡️ Popup Ad Blocked! Tap again to play.");
        });

        videoContainer.addEventListener('click', (e) => {
            document.getElementById('tick-sound').play().then(()=>document.getElementById('tick-sound').pause()).catch(e=>{});
            if(e.target.closest('.control-btn') || e.target.closest('.play-pause-btn')) { resetControlTimer(); return; }
            if (isLocked) { if (isControlsVisible) hideControls(); else showControls(); return; }
            if (isControlsVisible) hideControls(); else showControls();
        });

        video.addEventListener('playing', () => { loadingOverlay.classList.add('hidden'); showWatermark(); });
        video.addEventListener('pause', () => { hideWatermark(); });
        video.addEventListener('waiting', () => { loadingOverlay.classList.remove('hidden'); hideWatermark(); hideControls(); });

        btnPlayPause.addEventListener('click', (e) => {
            e.stopPropagation();
            if(currentStreamType === 'embed') { showToast("Use the embed player's internal controls"); return; }
            if (currentStreamType === 'youtube' && ytPlayer) {
                let state = ytPlayer.getPlayerState();
                if (state === YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); iconPlay.innerHTML = '<path d="M8 5v14l11-7z"/>'; showControls(); } 
                else { ytPlayer.playVideo(); iconPlay.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
            } else {
                if (video.paused) { video.play(); iconPlay.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; } 
                else { video.pause(); iconPlay.innerHTML = '<path d="M8 5v14l11-7z"/>'; showControls(); }
            }
        });

        const aspectModes = ['contain', 'cover', 'fill', 'scale-down', 'none'];
        const ytScaleModes = ['scale(1)', 'scale(1.35)', 'scale(1.35, 1.5)', 'scale(0.8)', 'scale(1)']; 
        const aspectIconsList = ['<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>','<path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>','<path d="M2 5h20v14H2z M4 7h16v10H4z M9 9h6v6H9z"/>','<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7V7h10v10z"/>','<path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM10 10h4v4h-4z"/>'];
        let aspectIndex = 0;
        
        document.getElementById('btn-aspect').addEventListener('click', (e) => {
            e.stopPropagation(); aspectIndex = (aspectIndex + 1) % aspectModes.length;
            video.style.objectFit = aspectModes[aspectIndex]; 
            
            let ytIframe = document.querySelector('#youtube-container iframe');
            if (ytIframe) ytIframe.style.transform = ytScaleModes[aspectIndex];
            
            document.getElementById('icon-aspect').innerHTML = aspectIconsList[aspectIndex];
            showToast("ASPECT CHANGED: " + aspectModes[aspectIndex].toUpperCase()); resetControlTimer();
        });

        document.getElementById('btn-pip').addEventListener('click', async (e) => {
            e.stopPropagation();
            if (currentStreamType === 'youtube' || currentStreamType === 'embed') {
                showToast("⚠️ PiP Support is Browser-Restricted for YouTube & Embeds.");
            } else {
                try { if (video !== document.pictureInPictureElement) await video.requestPictureInPicture(); else await document.exitPictureInPicture(); } catch(err) {}
            }
            resetControlTimer();
        });

        let isLocked = false;
        document.getElementById('btn-lock').addEventListener('click', (e) => {
            e.stopPropagation(); isLocked = !isLocked; const iconLock = document.getElementById('icon-lock');
            if (isLocked) { 
                videoContainer.classList.add('locked'); 
                iconLock.innerHTML = '<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>'; 
                showToast("SCREEN LOCKED"); resetControlTimer();
            } else { 
                videoContainer.classList.remove('locked'); 
                iconLock.innerHTML = '<path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>'; 
                showToast("SCREEN UNLOCKED"); resetControlTimer();
            }
        });

        function handleFullscreenChange() {
            const iconFs = document.getElementById('icon-fullscreen');
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(e=>{}); } catch (err) {}
                if(iconFs) iconFs.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
            } else {
                try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (err) {}
                if(iconFs) iconFs.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
            }
        }
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        document.getElementById('btn-fullscreen').addEventListener('click', async (e) => {
            e.stopPropagation(); 
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                try { 
                    if (videoContainer.requestFullscreen) await videoContainer.requestFullscreen(); 
                    else if (videoContainer.webkitRequestFullscreen) await videoContainer.webkitRequestFullscreen(); 
                } catch (err) {}
            } else {
                try {
                    if (document.exitFullscreen) await document.exitFullscreen(); 
                    else if (document.webkitExitFullscreen) await document.webkitExitFullscreen(); 
                } catch(err) {}
            } 
            resetControlTimer();
        });

        let startY = 0, startX = 0, startVol = 1, startBright = 0, isSwipingDrag = false;
        videoContainer.addEventListener('touchstart', (e) => { 
            if(!isLocked){ 
                startY = e.touches[0].clientY; startX = e.touches[0].clientX; startVol = video.volume; 
                if (currentStreamType === 'youtube' && ytPlayer && ytPlayer.getVolume) { startVol = ytPlayer.getVolume() / 100; }
                startBright = parseFloat(brightnessOverlay.style.opacity) || 0; isSwipingDrag = false; 
            }
        }, {passive: true});

        videoContainer.addEventListener('touchmove', (e) => {
            if(!isLocked) {
                const dy = startY - e.touches[0].clientY; const dx = Math.abs(startX - e.touches[0].clientX);
                if(Math.abs(dy) > 20 && dx < 40) { 
                    e.preventDefault(); isSwipingDrag = true; document.getElementById('swipe-indicator').classList.add('show');
                    let change = dy / (window.innerHeight * 0.7);
                    if(startX > window.innerWidth / 2) { 
                        let newVol = Math.max(0, Math.min(1, startVol + change)); video.volume = newVol; 
                        if (currentStreamType === 'youtube' && ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(newVol * 100);
                        let volPercent = Math.round(newVol * 100); document.getElementById('swipe-progress').style.width = `${volPercent}%`; 
                        document.getElementById('swipe-percent').innerText = `Volume: ${volPercent}%`;
                        document.getElementById('swipe-icon').innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>'; 
                    } else { 
                        let newOpacity = Math.max(0, Math.min(0.85, startBright - change)); brightnessOverlay.style.opacity = newOpacity; 
                        let brightPercent = Math.round((1 - (newOpacity / 0.85)) * 100); document.getElementById('swipe-progress').style.width = `${brightPercent}%`; 
                        document.getElementById('swipe-percent').innerText = `Brightness: ${brightPercent}%`;
                        document.getElementById('swipe-icon').innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/>'; 
                    }
                }
            }
        }, {passive: false});
        videoContainer.addEventListener('touchend', () => { setTimeout(() => { document.getElementById('swipe-indicator').classList.remove('show'); isSwipingDrag = false; }, 300); });

        let currentPlayingId = null; let matchCountdownInterval = null; const tickAudio = document.getElementById('tick-sound');
        function stopAllTimers() { clearInterval(matchCountdownInterval); tickAudio.pause(); tickAudio.currentTime = 0; document.getElementById('match-countdown-container').style.display = 'none'; }

        function prepareEmbedCode(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const iframes = doc.querySelectorAll('iframe');
            iframes.forEach(ifr => {
                ifr.setAttribute('allowfullscreen', 'true');
                ifr.setAttribute('webkitallowfullscreen', 'true');
                ifr.setAttribute('mozallowfullscreen', 'true');
                ifr.style.width = '100%';
                ifr.style.height = '100%';
                ifr.style.border = 'none';
            });
            return doc.body.innerHTML;
        }

        // Live Events Render
        function renderEvents() {
            const wrapper = document.getElementById('live-events-wrapper'); const container = document.getElementById('user-events-list');
            if(allEvents.length === 0) { wrapper.style.display = 'none'; return; }
            wrapper.style.display = 'block'; container.innerHTML = ''; const now = new Date().getTime();
            allEvents.forEach(match => {
                const startTs = new Date(match.startTime).getTime(); const endTs = new Date(match.endTime).getTime();
                let badge = now < startTs ? `<span class="event-badge" style="background:#f39c12; color:#000;">UPCOMING</span>` : (now >= startTs && now <= endTs) ? `<span class="event-badge">LIVE NOW</span>` : `<span class="event-badge" style="background:#2c3e50; animation:none;">END MATCH</span>`;
                const card = document.createElement('div'); card.className = 'event-card tv-focusable'; card.tabIndex = 0; card.dataset.id = match.id;
                if(match.id === currentPlayingId) card.classList.add('active');
                card.onclick = () => { if(isMouseDragging) return; playMatch(match.id); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                card.innerHTML = `${badge}<img src="${match.logo}" onerror="this.src='https://via.placeholder.com/150/ffffff/000000?text=MATCH'"><p>${match.matchName}</p>`;
                container.appendChild(card);
            });
            attachDragToScroll();
        }

        // 3. New Fetched M3U Playlist Categories Render (Dynamic Horizontal Scroll)
        function renderPlaylistChannels() {
            const wrapper = document.getElementById('playlist-wrapper');
            if(allPlaylistChannels.length === 0) { wrapper.innerHTML = ''; return; }
            
            const grouped = allPlaylistChannels.reduce((acc, ch) => {
                const cat = (ch.category || 'others').toLowerCase();
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(ch);
                return acc;
            }, {});

            wrapper.innerHTML = ''; 

            for (const cat in grouped) {
                const catHtml = `
                    <div class="cat-title-wrap">
                        <h4>📂 ${cat} CHANNELS</h4>
                    </div>
                    <div class="channel-scroll-container">
                        ${grouped[cat].map(ch => {
                            let isActive = ch.id === currentPlayingId ? 'active' : '';
                            return `
                                <div class="channel-card tv-focusable ${isActive}" tabindex="0" data-id="${ch.id}" onclick="if(isMouseDragging) return; playVideo('${ch.url}', '${ch.id}', 'm3u8'); window.scrollTo({ top: 0, behavior: 'smooth' });">
                                    <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/150/ffffff/000000?text=TV'">
                                    <p>${ch.name}</p>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                wrapper.innerHTML += catHtml;
            }
            attachDragToScroll();
        }

        function playMatch(id) {
            stopAllTimers(); currentPlayingId = id; hideWatermark(); currentStreamType = 'embed'; ytOverlayClick.style.display = 'none'; 
            document.querySelectorAll('.channel-card, .event-card').forEach(c => c.classList.remove('active'));
            document.querySelector(`.event-card[data-id="${id}"]`)?.classList.add('active');
            if (window.hls) window.hls.destroy(); video.pause(); video.style.display = 'none';
            youtubeContainer.innerHTML = ''; youtubeContainer.style.display = 'none';
            const match = allEvents.find(e => e.id === id); if(!match) return;
            document.getElementById('mc-logo').src = match.logo || 'https://via.placeholder.com/150';
            document.getElementById('mc-title').innerText = match.matchName;
            loadingOverlay.classList.add('hidden');
            const startTs = new Date(match.startTime).getTime();
            function checkStatus() {
                const now = new Date().getTime();
                if (now < startTs) {
                    document.getElementById('match-countdown-container').style.display = 'flex';
                    let diff = startTs - now;
                    let h = Math.floor(diff / (1000 * 60 * 60)), m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)), s = Math.floor((diff % (1000 * 60)) / 1000);
                    document.getElementById('mc-timer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                    document.getElementById('mc-status').innerHTML = "Match is starting soon..."; document.getElementById('mc-status').style.color = "#f39c12"; tickAudio.play().catch(e => {}); 
                } else { 
                    stopAllTimers(); youtubeContainer.style.display = 'block'; loadingOverlay.classList.remove('hidden');
                    youtubeContainer.innerHTML = prepareEmbedCode(match.embedCode || `<h3 style="color:white; text-align:center; padding:50px;">Stream Link not added yet.</h3>`);
                    ytOverlayClick.style.display = 'none'; 
                    adShield.style.display = 'block'; 
                    setTimeout(() => { loadingOverlay.classList.add('hidden'); showWatermark(); }, 1500);
                }
            }
            checkStatus(); matchCountdownInterval = setInterval(checkStatus, 1000); setTimeout(() => videoContainer.focus(), 300);
        }

        function extractYouTubeID(url) { let match = url.match(/^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/); return (match && match[7].length == 11) ? match[7] : url; }

        function playVideo(url, id, type) {
            stopAllTimers(); currentPlayingId = id; hideControls(); loadingOverlay.classList.remove('hidden'); hideWatermark(); currentStreamType = type || 'm3u8';
            document.querySelectorAll('.channel-card, .event-card').forEach(c => c.classList.remove('active'));
            let activeCard = document.querySelector(`.channel-card[data-id="${id}"]`);
            if(activeCard) activeCard.classList.add('active');

            if (type === 'youtube') {
                adShield.style.display = 'none';
                if (typeof YT === 'undefined' || typeof YT.Player === 'undefined') { setTimeout(() => playVideo(url, id, type), 500); return; }
                if (window.hls) window.hls.destroy(); video.pause(); video.style.display = 'none'; youtubeContainer.style.display = 'block'; ytOverlayClick.style.display = 'block';
                let ytId = extractYouTubeID(url);
                if (!ytPlayer) {
                    youtubeContainer.innerHTML = '<div id="yt-player-iframe"></div>';
                    ytPlayer = new YT.Player('yt-player-iframe', {
                        videoId: ytId, playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0, 'playsinline': 1 },
                        events: {
                            'onReady': (e) => { e.target.playVideo(); loadingOverlay.classList.add('hidden'); showWatermark(); },
                            'onStateChange': (e) => {
                                if (e.data === YT.PlayerState.PLAYING) { loadingOverlay.classList.add('hidden'); showWatermark(); iconPlay.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; } 
                                else if (e.data === YT.PlayerState.PAUSED) { hideWatermark(); iconPlay.innerHTML = '<path d="M8 5v14l11-7z"/>'; } 
                                else if (e.data === YT.PlayerState.BUFFERING) { loadingOverlay.classList.remove('hidden'); hideWatermark(); }
                            }
                        }
                    });
                } else { ytPlayer.loadVideoById(ytId); }
            } else if (type === 'embed') {
                if (window.hls) window.hls.destroy(); video.pause(); video.style.display = 'none'; youtubeContainer.style.display = 'block'; 
                ytOverlayClick.style.display = 'none'; 
                youtubeContainer.innerHTML = prepareEmbedCode(url); 
                adShield.style.display = 'block'; 
                setTimeout(() => { loadingOverlay.classList.add('hidden'); showWatermark(); }, 1500);
            } else {
                adShield.style.display = 'none';
                youtubeContainer.innerHTML = ''; youtubeContainer.style.display = 'none'; video.style.display = 'block'; ytOverlayClick.style.display = 'none';
                if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
                if (Hls.isSupported()) { 
                    if (window.hls) window.hls.destroy(); 
                    window.hls = new Hls({ lowLatencyMode: true, backBufferLength: 90 }); window.hls.loadSource(url); window.hls.attachMedia(video); 
                    window.hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(e=>console.log(e)); iconPlay.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }); 
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) { 
                    video.src = url; video.addEventListener('loadedmetadata', () => video.play().catch(e=>console.log(e))); 
                }
            } setTimeout(() => videoContainer.focus(), 300);
        }

        function renderCustomChannels() {
            const q = document.getElementById('searchInput').value.toLowerCase(); const c = document.getElementById('user-category-filter').value;
            const container = document.getElementById('user-channel-list'); container.innerHTML = '';
            let filtered = allCustomChannels.filter(ch => (ch.name.toLowerCase().includes(q)) && (c === 'all' || (ch.category || 'others') === c));
            if(filtered.length === 0) { container.innerHTML = '<p style="color: #666; width: 100%; text-align: center; padding: 20px;">No custom channels found.</p>'; return; }
            filtered.forEach(ch => {
                const card = document.createElement('div'); card.className = 'channel-card tv-focusable'; card.tabIndex = 0; card.dataset.id = ch.id;
                if(ch.id === currentPlayingId) card.classList.add('active');
                card.onclick = () => { if(isMouseDragging) return; playVideo(ch.url, ch.id, ch.type || 'm3u8'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                card.innerHTML = `<img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/150/ffffff/000000?text=TV'"><p>${ch.name}</p>`;
                container.appendChild(card);
            });
            attachDragToScroll();
        }
    </script>
</body>
