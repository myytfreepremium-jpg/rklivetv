    <style>
        /* Base Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: #0b0b0f; color: #ffffff; overflow-x: hidden; width: 100%; -webkit-tap-highlight-color: transparent; }

        /* =========================================
           SMART TV FOCUS STYLES (REMOTE NAVIGATION ONLY)
           ========================================= */
        :focus { outline: none !important; box-shadow: none !important; }

        .tv-mode .tv-focusable:focus { 
            outline: 3px solid #00d2ff !important; 
            box-shadow: 0 0 15px #00d2ff !important; 
            transform: scale(1.05); 
            z-index: 100; 
            border-radius: 8px; 
            transition: all 0.2s ease;
        }
        .tv-mode .channel-card:focus {
            border-color: #00d2ff !important;
            background: #22222a !important;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5) !important;
            transform: scale(1.08);
        }
        .tv-mode .control-btn:focus, .tv-mode .play-pause-btn:focus {
            outline: 3px solid #ff0055 !important;
            box-shadow: 0 0 15px #ff0055 !important;
            background: rgba(255, 0, 85, 0.3) !important;
        }
        .tv-mode #videoContainer:focus {
            outline: 3px solid rgba(0, 210, 255, 0.5) !important;
        }

        /* Navbar & Custom Logo */
        .navbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 10px 15px; background-color: #0f0f13; border-bottom: 1px solid #1f1f25; position: sticky; top: 0; z-index: 100; width: 100%; gap: 10px; }
        .logo-time-container { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        
        .logo-wrapper { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .logo-text { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 5px; letter-spacing: 1px; }
        .logo-text span.live { color: #ff0055; }
        .logo-text span.tv { background-color: #00d2ff; color: #000; padding: 2px 8px; border-radius: 6px; font-size: 16px; font-weight: bold; }

        /* --- CUSTOM ANIMATED LOGO CSS --- */
        .loader {
            --color-one: #ffbf48; --color-two: #be4a1d; --color-three: #ffbf4780; --color-four: #bf4a1d80; --color-five: #ffbf4740;
            --time-animation: 2s; 
            position: relative; border-radius: 50%; transform: scale(var(--size));
            box-shadow: 0 0 25px 0 var(--color-three), 0 20px 50px 0 var(--color-four);
            animation: colorize calc(var(--time-animation) * 3) ease-in-out infinite;
        }
        .loader-header { --size: 0.4; margin-right: -25px; margin-left: -25px; } 
        .loader-main { --size: 0.8; margin-bottom: 20px; } 

        .loader::before { content: ""; position: absolute; top: 0; left: 0; width: 100px; height: 100px; border-radius: 50%; border-top: solid 1px var(--color-one); border-bottom: solid 1px var(--color-two); background: linear-gradient(180deg, var(--color-five), var(--color-four)); box-shadow: inset 0 10px 10px 0 var(--color-three), inset 0 -10px 10px 0 var(--color-four); }
        .loader .box { width: 100px; height: 100px; background: linear-gradient(180deg, var(--color-one) 30%, var(--color-two) 70%); }
        .loader svg { position: absolute; top:0; left:0;}
        .loader svg mask { filter: contrast(15); animation: roundness calc(var(--time-animation) / 2) linear infinite; }
        .loader svg mask polygon { filter: blur(7px); }
        .loader svg mask polygon:nth-child(1) { transform-origin: 75% 25%; transform: rotate(90deg); }
        .loader svg mask polygon:nth-child(2) { transform-origin: 50% 50%; animation: rotation var(--time-animation) linear infinite reverse; }
        .loader svg mask polygon:nth-child(3) { transform-origin: 50% 60%; animation: rotation var(--time-animation) linear infinite; animation-delay: calc(var(--time-animation) / -3); }
        .loader svg mask polygon:nth-child(4) { transform-origin: 40% 40%; animation: rotation var(--time-animation) linear infinite reverse; }
        .loader svg mask polygon:nth-child(5) { transform-origin: 40% 40%; animation: rotation var(--time-animation) linear infinite reverse; animation-delay: calc(var(--time-animation) / -2); }
        .loader svg mask polygon:nth-child(6) { transform-origin: 60% 40%; animation: rotation var(--time-animation) linear infinite; }
        .loader svg mask polygon:nth-child(7) { transform-origin: 60% 40%; animation: rotation var(--time-animation) linear infinite; animation-delay: calc(var(--time-animation) / -1.5); }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes roundness { 0%, 100% { filter: contrast(15); } 20%, 40% { filter: contrast(3); } 60% { filter: contrast(15); } }
        @keyframes colorize { 0%, 100% { filter: hue-rotate(0deg); } 20% { filter: hue-rotate(-30deg); } 40% { filter: hue-rotate(-60deg); } 60% { filter: hue-rotate(-90deg); } 80% { filter: hue-rotate(-45deg); } }

        /* FLIP CALENDAR CLOCK */
        .flip-clock { display: flex; gap: 4px; align-items: center; font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        .flip-digit { background: #22222a; color: #00d2ff; padding: 4px 6px; border-radius: 4px; box-shadow: inset 0 -2px 5px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.3); font-size: 14px; position: relative; border: 1px solid #333; }
        .flip-digit::after { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: rgba(0,0,0,0.4); }
        .flip-ampm { font-size: 11px; color: #ff0055; margin-left: 2px; }

        /* Search Box */
        .search-container { position: relative; flex-grow: 1; max-width: 250px; }
        .search-box { background: #16161a; border: 1px solid #2c2c35; color: white; padding: 10px 15px 10px 35px; border-radius: 20px; outline: none; width: 100%; font-size: 14px; transition: 0.3s; }
        .search-box:focus { border-color: #00d2ff !important; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.6; pointer-events: none; }

        /* Video Player & Premium Toast */
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        video { width: 100%; height: 100%; outline: none; display: block; transition: object-fit 0.3s ease; }
        
        #youtube-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; display: none; background: #000; }
        #youtube-container iframe { width: 100%; height: 100%; border: none; }

        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #00d2ff; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none; border: 1px solid #00d2ff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); text-transform: uppercase; letter-spacing: 1px;}
        .toast.show { opacity: 1; }

        /* Brightness Overlay */
        #brightness-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; opacity: 0; pointer-events: none; z-index: 35; transition: opacity 0.1s; }

        /* Swipe Indicator */
        .swipe-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 65; opacity: 0; transition: opacity 0.2s; pointer-events: none; border: 1px solid #333; }
        .swipe-indicator.show { opacity: 1; }
        .swipe-indicator svg { width: 30px; height: 30px; fill: white; }
        .swipe-bar { width: 80px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .swipe-progress { height: 100%; background: #00d2ff; width: 50%; }

        /* Loader Overlay */
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0f; z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.3s; }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }

        /* Professional Player Controls */
        .player-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 75%, rgba(0,0,0,0.8) 100%); 
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 60;}
        .player-controls.active { opacity: 1; pointer-events: auto; }
        
        .controls-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .controls-top .left, .controls-top .right { display: flex; gap: 10px; align-items: center; }
        .control-btn { background: none; border: none; color: white; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; border-radius: 50%; outline: none; }
        .control-btn svg { width: 28px; height: 28px; fill: white; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8)); transition: 0.2s; }
        .control-btn:hover svg { fill: #00d2ff; }

        .controls-bottom { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .buttons-bottom { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; }
        
        .center-controls { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 30px; align-items: center; }
        .play-pause-btn { width: 65px; height: 65px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid rgba(255,255,255,0.7); transition: transform 0.2s; outline: none;}
        .play-pause-btn svg { width: 35px; height: 35px; fill: white; margin-left: 4px; }
        .play-pause-btn:active { transform: scale(0.9); }

        .progress-container { display: flex; align-items: center; gap: 15px; width: 100%; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 3px black; }
        .progress-bar { flex-grow: 1; -webkit-appearance: none; appearance: none; height: 5px; background: rgba(255, 255, 255, 0.3); border-radius: 5px; outline: none; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #00d2ff; cursor: pointer; box-shadow: 0 0 5px rgba(0,210,255,0.8); }
        
        .video-wrapper.locked .controls-top .left, .video-wrapper.locked .controls-top .right .control-btn:not(#btn-lock), .video-wrapper.locked .controls-bottom, .video-wrapper.locked .center-controls { display: none !important; }

        /* Notice & Filters */
        .notice-container { display: flex; align-items: center; background: #131318; border-bottom: 1px solid #222; }
        .notice-badge { background: linear-gradient(90deg, #ff0055, #ff0000); color: white; padding: 6px 15px; font-size: 13px; font-weight: bold; border-radius: 20px; margin: 5px 10px; white-space: nowrap; z-index: 2; box-shadow: 0 0 10px rgba(255,0,0,0.4); }
        .notice-marquee { color: #00d2ff; font-size: 15px; padding-right: 10px; }

        .filter-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 12px 15px; background-color: #0b0b0f; border-bottom: 1px solid #1a1a21; gap: 10px; }
        .filter-container h3 { font-size: 16px; color: #fff; font-weight: bold; margin: 0; }
        .category-select { background: #16161a; color: #00d2ff; border: 1px solid #2c2c35; padding: 8px 15px; border-radius: 20px; outline: none; font-size: 14px; font-weight: bold; cursor: pointer; }

        /* Channel Container */
        .channel-scroll-container { display: flex; flex-wrap: nowrap; overflow-x: auto; padding: 20px 15px; gap: 15px; background: #0b0b0f; scroll-behavior: smooth; scrollbar-width: none; }
        .channel-scroll-container::-webkit-scrollbar { display: none; } 
        .channel-card { flex: 0 0 auto; width: 140px; background: #1a1a21; border-radius: 12px; padding: 10px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; outline: none; }
        .channel-card.active { border-color: #00d2ff; background: #22222a; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        .channel-card img { width: 100%; height: 75px; object-fit: contain; background: #ffffff; border-radius: 8px; margin-bottom: 10px; padding: 4px;}
        .channel-card p { font-size: 14px; text-align: center; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; font-weight: bold; }

        /* Play Store Style Button */
        .playstore-btn {
            display: none; background: #000; color: white; margin: 20px auto; max-width: 300px; text-decoration: none;
            border-radius: 10px; border: 1px solid #444; padding: 10px 20px; align-items: center; gap: 15px;
            transition: 0.3s; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); outline: none;
        }
        .playstore-btn:hover, .playstore-btn:focus { background: #111; border-color: #00d2ff; }
        .playstore-btn svg { width: 35px; height: 35px; }
        .playstore-text { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
        .playstore-text span:first-child { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        .playstore-text span:last-child { font-size: 18px; font-weight: bold; }

        .ad-container { width: 100%; display: none; justify-content: center; align-items: center; margin: 10px 0; min-height: 60px; overflow: hidden; background: #0f0f13; }

        @media (max-width: 600px) {
            .navbar { justify-content: center; }
            .logo-time-container { width: 100%; justify-content: space-between; }
            .search-container { max-width: 100%; width: 100%; margin-top: 10px; }
            .channel-card { width: 120px; } .channel-card img { height: 65px; }
        }
        @media (min-width: 1024px) { 
            .channel-scroll-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; overflow-x: hidden; padding: 30px; }
            .channel-card { width: 100%; padding: 15px; } .channel-card img { height: 90px; }
            .search-container { max-width: 350px; }
        }
    </style>
</head>

    <script>
        // ==========================================
        // FIREBASE REST API INTEGRATION
        // (Bypasses the 100 User WebSocket Limit)
        // ==========================================
        const FIREBASE_DB_URL = "https://my-digital-store-917ee-default-rtdb.firebaseio.com";

        let allChannels = [];
        let isInitialLoad = true;

        async function fetchFirebaseData() {
            try {
                // Fetch Channels and Settings securely via REST API
                const [channelsRes, settingsRes] = await Promise.all([
                    fetch(`${FIREBASE_DB_URL}/channels.json`),
                    fetch(`${FIREBASE_DB_URL}/settings.json`)
                ]);

                const channelsObj = await channelsRes.json();
                const settingsObj = await settingsRes.json();

                // Process Channels
                let newChannels = [];
                if (channelsObj) {
                    Object.keys(channelsObj).forEach(key => {
                        newChannels.push({ id: key, ...channelsObj[key] });
                    });
                    newChannels.sort((a, b) => (a.order || 0) - (b.order || 0));
                }
                
                allChannels = newChannels;
                renderChannels();

                // Play first video automatically
                if (isInitialLoad && allChannels.length > 0) {
                    playVideo(allChannels[0].url, allChannels[0].id, allChannels[0].type || 'm3u8');
                    isInitialLoad = false;
                }

                // Process Settings
                if (settingsObj) {
                    document.getElementById('user-notice').textContent = settingsObj.notice || "Welcome to RK LIVE TV!";
                    
                    const btn = document.getElementById('app-download-btn');
                    if (settingsObj.appUrl && settingsObj.appUrl.trim() !== "") {
                        btn.href = settingsObj.appUrl;
                        btn.style.display = 'flex';
                    } else {
                        btn.style.display = 'none';
                    }

                    // Ads Processing
                    if (settingsObj.ads) {
                        const adData = settingsObj.ads;
                        const b1 = document.getElementById('ad-banner-1'); 
                        if(adData.banner1 && adData.banner1.status === 'enabled') { b1.style.display = 'flex'; b1.innerHTML = adData.banner1.code; } else b1.style.display = 'none';
                        
                        const b2 = document.getElementById('ad-banner-2'); 
                        if(adData.banner2 && adData.banner2.status === 'enabled') { b2.style.display = 'flex'; b2.innerHTML = adData.banner2.code; } else b2.style.display = 'none';
                        
                        const p = document.getElementById('popup-ads-container'); p.innerHTML = ''; 
                        if(adData.popup1 && adData.popup1.status === 'enabled') p.innerHTML += adData.popup1.code;
                        if(adData.popup2 && adData.popup2.status === 'enabled') p.innerHTML += adData.popup2.code;
                    }
                }
            } catch (error) {
                console.error("Error loading data from Firebase REST API:", error);
            }
        }

        // Fetch data immediately when user loads the page
        fetchFirebaseData();

        // Silent Auto-Update every 3 minutes (180000ms) without refreshing the page
        setInterval(fetchFirebaseData, 180000);


        // --- TV & MOBILE FOCUS DETECTION ---
        document.addEventListener('keydown', (e) => {
            if (e.key.includes('Arrow') || e.key === 'Enter') {
                document.body.classList.add('tv-mode');
            }
            
            const active = document.activeElement;
            const isVideoFocused = (active.id === 'videoContainer' || active.tagName === 'BODY');

            if (e.key === 'Enter') {
                if (active && (active.classList.contains('channel-card') || active.classList.contains('control-btn') || active.classList.contains('play-pause-btn') || active.classList.contains('playstore-btn'))) {
                    e.preventDefault();
                    active.click();
                } else if (isVideoFocused) {
                    e.preventDefault();
                    if (!isControlsVisible) showControls();
                    else document.getElementById('btn-playpause').click();
                }
            }
            
            if (e.key.includes('Arrow')) {
                if (isVideoFocused || active.closest('#playerControls')) {
                    showControls();
                }
            }
        });

        document.addEventListener('mousedown', () => { document.body.classList.remove('tv-mode'); });
        document.addEventListener('touchstart', () => { document.body.classList.remove('tv-mode'); }, { passive: true });

        // --- Clock ---
        function updateClock() {
            const now = new Date();
            let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12; h = h ? h : 12; 
            document.getElementById('flip-h').innerText = h.toString().padStart(2, '0');
            document.getElementById('flip-m').innerText = m.toString().padStart(2, '0');
            document.getElementById('flip-s').innerText = s.toString().padStart(2, '0');
            document.getElementById('flip-ampm').innerText = ampm;
        }
        setInterval(updateClock, 1000); updateClock();

        // --- Video Player Controls ---
        const video = document.getElementById('video-player');
        const videoContainer = document.getElementById('videoContainer');
        const playerControls = document.getElementById('playerControls');
        const youtubeContainer = document.getElementById('youtube-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const brightnessOverlay = document.getElementById('brightness-overlay');
        const btnPlayPause = document.getElementById('btn-playpause');
        const iconPlay = document.getElementById('icon-play');
        const swipeIndicator = document.getElementById('swipe-indicator');
        const swipeProgress = document.getElementById('swipe-progress');
        const swipeIcon = document.getElementById('swipe-icon');
        const toastMsg = document.getElementById('toast-msg');

        document.addEventListener('contextmenu', event => event.preventDefault());

        let isControlsVisible = false; 
        let controlTimeout;
        let isSwipingDrag = false; 

        const hideControls = () => { 
            playerControls.classList.remove('active'); 
            isControlsVisible = false; 
            clearTimeout(controlTimeout); 
        };

        const showControls = () => { 
            if(!loadingOverlay.classList.contains('hidden')) return; 
            playerControls.classList.add('active'); 
            isControlsVisible = true; 
            resetControlTimer(); 
        };

        const resetControlTimer = () => { 
            clearTimeout(controlTimeout); 
            controlTimeout = setTimeout(hideControls, 3000); 
        };

        videoContainer.addEventListener('click', (e) => {
            if(isSwipingDrag) return; 
            if(e.target.closest('.control-btn') || e.target.closest('.play-pause-btn') || e.target.closest('.progress-container')) {
                resetControlTimer(); return;
            }
            if (isControlsVisible) hideControls();
            else showControls();
        });

        video.addEventListener('playing', () => { loadingOverlay.classList.add('hidden'); });
        video.addEventListener('waiting', () => { loadingOverlay.classList.remove('hidden'); hideControls(); });

        btnPlayPause.addEventListener('click', (e) => {
            e.stopPropagation();
            if (video.paused) { video.play(); iconPlay.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; } 
            else { video.pause(); iconPlay.innerHTML = '<path d="M8 5v14l11-7z"/>'; showControls(); }
        });

        // Aspect Ratios
        const aspectModes = ['contain', 'cover', 'fill', 'scale-down', 'none'];
        const aspectNames = ['FIT TO SCREEN', 'ZOOM (COVER)', 'STRETCH (FILL)', 'SCALE DOWN', 'ORIGINAL SIZE'];
        const aspectIconsList = [
            '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>',
            '<path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>',
            '<path d="M2 5h20v14H2z M4 7h16v10H4z M9 9h6v6H9z"/>',
            '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7V7h10v10z"/>',
            '<path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM10 10h4v4h-4z"/>'
        ];

        let aspectIndex = 0;
        let toastTimeout;
        const showToast = (message) => {
            toastMsg.innerText = message; toastMsg.classList.add('show');
            clearTimeout(toastTimeout); toastTimeout = setTimeout(() => toastMsg.classList.remove('show'), 2000);
        };

        document.getElementById('btn-aspect').addEventListener('click', (e) => {
            e.stopPropagation();
            aspectIndex = (aspectIndex + 1) % aspectModes.length;
            video.style.objectFit = aspectModes[aspectIndex];
            document.getElementById('icon-aspect').innerHTML = aspectIconsList[aspectIndex];
            showToast(aspectNames[aspectIndex]);
            resetControlTimer();
        });

        document.getElementById('btn-fullscreen').addEventListener('click', async (e) => {
            e.stopPropagation();
            const iconFs = document.getElementById('icon-fullscreen');
            if (!document.fullscreenElement) {
                try { if (videoContainer.requestFullscreen) await videoContainer.requestFullscreen(); else if (videoContainer.webkitRequestFullscreen) await videoContainer.webkitRequestFullscreen(); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (err) {}
                iconFs.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>'; 
            } else {
                if (document.exitFullscreen) await document.exitFullscreen(); else if (document.webkitExitFullscreen) await document.webkitExitFullscreen(); if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                iconFs.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>'; 
            }
            resetControlTimer();
        });

        let isLocked = false;
        document.getElementById('btn-lock').addEventListener('click', (e) => {
            e.stopPropagation();
            isLocked = !isLocked;
            const iconLock = document.getElementById('icon-lock');
            if (isLocked) { videoContainer.classList.add('locked'); iconLock.innerHTML = '<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>'; hideControls(); } 
            else { videoContainer.classList.remove('locked'); iconLock.innerHTML = '<path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>'; showControls(); }
        });

        // Swipe Gestures
        let startY = 0, startX = 0, isSwiping = false;
        let initialVolume = 1, initialBrightness = 0;
        const volIcon = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        const brightIcon = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/>';

        videoContainer.addEventListener('touchstart', (e) => {
            if(isLocked) return;
            startY = e.touches[0].clientY; startX = e.touches[0].clientX;
            initialVolume = video.volume; initialBrightness = parseFloat(brightnessOverlay.style.opacity) || 0;
            isSwiping = false; isSwipingDrag = false;
        });

        videoContainer.addEventListener('touchmove', (e) => {
            if(isLocked) return;
            const dy = startY - e.touches[0].clientY, dx = Math.abs(startX - e.touches[0].clientX);
            if(Math.abs(dy) > 20 && dx < 40) {
                isSwiping = true; isSwipingDrag = true; e.preventDefault();
                swipeIndicator.classList.add('show');
                if(startX > window.innerWidth / 2) {
                    swipeIcon.innerHTML = volIcon; let newVol = initialVolume + (dy / 200);
                    newVol = Math.max(0, Math.min(1, newVol)); video.volume = newVol; swipeProgress.style.width = `${newVol * 100}%`;
                } else {
                    swipeIcon.innerHTML = brightIcon; let newBright = initialBrightness - (dy / 200); 
                    newBright = Math.max(0, Math.min(0.85, newBright)); brightnessOverlay.style.opacity = newBright; swipeProgress.style.width = `${(1 - (newBright/0.85)) * 100}%`;
                }
            }
        }, {passive: false});

        videoContainer.addEventListener('touchend', () => {
            if(isSwiping) { setTimeout(() => { swipeIndicator.classList.remove('show'); isSwipingDrag = false; }, 300); isSwiping = false; }
        });

        // --- Channel Play Logic ---
        let currentPlayingId = null;
        function extractYouTubeID(url) { let match = url.match(/^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/); return (match && match[7].length == 11) ? match[7] : url; }

        function playVideo(url, id, type) {
            hideControls(); 
            loadingOverlay.classList.remove('hidden'); 
            currentPlayingId = id;
            
            document.querySelectorAll('.channel-card').forEach(c => { c.classList.remove('active'); if(c.dataset.id === id) c.classList.add('active'); });

            if (type === 'youtube') {
                if (window.hls) window.hls.destroy(); video.pause(); video.style.display = 'none'; 
                youtubeContainer.style.display = 'block';
                youtubeContainer.innerHTML = `<iframe sandbox="allow-scripts allow-same-origin allow-presentation" src="https://www.youtube.com/embed/${extractYouTubeID(url)}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
                setTimeout(() => loadingOverlay.classList.add('hidden'), 1000);
            } else if (type === 'embed') {
                if (window.hls) window.hls.destroy(); video.pause(); video.style.display = 'none';
                youtubeContainer.style.display = 'block';
                youtubeContainer.innerHTML = url;
                setTimeout(() => loadingOverlay.classList.add('hidden'), 1500);
            } else {
                youtubeContainer.innerHTML = ''; youtubeContainer.style.display = 'none'; video.style.display = 'block';
                if (Hls.isSupported()) { 
                    if (window.hls) window.hls.destroy(); 
                    window.hls = new Hls({ lowLatencyMode: true, backBufferLength: 90 }); 
                    window.hls.loadSource(url); window.hls.attachMedia(video); 
                    window.hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                        video.play().catch(e=>console.log("Auto-play prevented")); 
                        iconPlay.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; 
                    }); 
                } 
                else if (video.canPlayType('application/vnd.apple.mpegurl')) { 
                    video.src = url; video.addEventListener('loadedmetadata', () => { video.play().catch(e=>console.log(e)); }); 
                }
            }
            
            setTimeout(() => { videoContainer.focus(); }, 300);
        }

        function renderChannels() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const c = document.getElementById('user-category-filter').value;
            const container = document.getElementById('user-channel-list'); 
            
            container.innerHTML = '';
            
            let filtered = allChannels.filter(ch => (ch.name.toLowerCase().includes(q)) && (c === 'all' || (ch.category || 'others') === c));
            
            if(filtered.length === 0) { 
                container.innerHTML = '<p style="color: #666; width: 100%; text-align: center; padding: 20px;">No channels found.</p>'; 
                return; 
            }
            
            filtered.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card tv-focusable'; 
                card.tabIndex = 0; 
                
                if(ch.id === currentPlayingId) card.classList.add('active');
                card.dataset.id = ch.id;
                
                card.onclick = () => { playVideo(ch.url, ch.id, ch.type || 'm3u8'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                card.addEventListener('focus', () => { card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); });

                const img = document.createElement('img');
                img.src = ch.logo; img.onerror = function() { this.src = 'https://via.placeholder.com/150/ffffff/000000?text=TV'; };
                
                const p = document.createElement('p');
                p.textContent = ch.name;

                card.appendChild(img); card.appendChild(p);
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
