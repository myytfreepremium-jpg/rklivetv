<html lang="en">
<head>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        /* Base Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0f; color: #ffffff; overflow-x: hidden; width: 100%; }

        /* ============================================================
           TV REMOTE vs MOBILE TOUCH LOGIC (CRUCIAL)
           ============================================================ */
        /* Hide outline for touch/mouse clicks to keep Mobile view clean */
        :focus:not(:focus-visible) { outline: none !important; box-shadow: none !important; }
        
        /* Show outline ONLY when navigating with Keyboard or TV Remote */
        :focus-visible {
            outline: 4px solid #ff0055 !important;
            box-shadow: 0 0 20px #ff0055 !important;
            border-radius: 8px;
            transition: all 0.2s ease;
            z-index: 100;
        }

        /* Navbar & Clock */
        .navbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 12px 15px; background-color: #0f0f13; border-bottom: 1px solid #1f1f25; position: sticky; top: 0; z-index: 100; width: 100%; gap: 10px; }
        .logo-time-container { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .logo { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 5px; letter-spacing: 1px; cursor: pointer; }
        .logo span.live { color: #ff0055; }
        .logo span.tv { background-color: #00d2ff; color: #000; padding: 2px 8px; border-radius: 6px; font-size: 16px; font-weight: bold; }
        
        .realtime-clock { font-size: 13px; color: #00d2ff; font-weight: bold; background: #1a1a21; padding: 5px 12px; border-radius: 20px; border: 1px solid #2c2c35; display: flex; gap: 5px; align-items: center; }

        .search-container { position: relative; flex-grow: 1; max-width: 250px; }
        .search-box { background: #16161a; border: 1px solid #2c2c35; color: white; padding: 10px 15px 10px 35px; border-radius: 20px; outline: none; width: 100%; font-size: 14px; transition: 0.3s; }
        .search-box:focus { border-color: #00d2ff; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.6; pointer-events: none; }

        /* Video Player */
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        video { width: 100%; height: 100%; outline: none; display: block; transition: object-fit 0.3s ease; }
        
        #youtube-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; display: none; background: #000; }
        #youtube-container iframe { width: 100%; height: 100%; border: none; }

        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none; }
        .toast.show { opacity: 1; }

        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.3s; }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 45px; height: 45px; border-radius: 50%; border-left-color: #00d2ff; animation: spin 1s linear infinite; margin-top: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Player Controls */
        .player-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; background: rgba(0, 0, 0, 0.6); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 60;}
        .player-controls.active { opacity: 1; pointer-events: auto; }
        
        .controls-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .controls-top .left, .controls-top .right { display: flex; gap: 15px; align-items: center; }
        .control-btn { background: none; border: none; color: white; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; border-radius: 50%; outline: none; }
        .control-btn:active { transform: scale(0.9); }
        .control-btn svg { width: 32px; height: 32px; fill: white; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5)); transition: 0.2s; }

        .controls-bottom { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .buttons-bottom { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 10px; }
        
        .center-controls { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 30px; align-items: center; }
        .play-pause-btn { width: 70px; height: 70px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: none; outline: none; transition: transform 0.2s; }
        .play-pause-btn:active { transform: scale(0.9); }
        .play-pause-btn svg { width: 35px; height: 35px; fill: black; }
        .skip-btn svg { width: 40px; height: 40px; }

        .progress-container { display: flex; align-items: center; gap: 15px; width: 100%; font-size: 15px; font-weight: bold; text-shadow: 1px 1px 3px black; }
        .progress-bar { flex-grow: 1; -webkit-appearance: none; appearance: none; height: 6px; background: rgba(255, 255, 255, 0.3); border-radius: 5px; outline: none; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: white; cursor: pointer; }
        
        .video-wrapper.locked .controls-top .left,
        .video-wrapper.locked .controls-top .right .control-btn:not(#btn-lock),
        .video-wrapper.locked .controls-bottom,
        .video-wrapper.locked .center-controls { display: none !important; }
        .video-wrapper:fullscreen { aspect-ratio: auto; width: 100vw; height: 100vh; }

        /* Notice & Filters */
        .notice-container { display: flex; align-items: center; background: #131318; border-top: 1px solid #222; border-bottom: 1px solid #222; }
        .notice-badge { background: linear-gradient(90deg, #ff0055, #ff0000); color: white; padding: 8px 15px; font-size: 13px; font-weight: bold; border-radius: 20px; margin: 8px 10px; white-space: nowrap; z-index: 2; box-shadow: 0 0 10px rgba(255,0,0,0.4); }
        .notice-marquee { color: #00d2ff; font-size: 15px; padding-right: 10px; font-weight: 500; }

        .filter-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 12px 15px; background-color: #0b0b0f; border-bottom: 1px solid #1a1a21; gap: 10px; }
        .filter-container h3 { font-size: 16px; color: #fff; font-weight: bold; margin: 0; }
        .category-select { background: #16161a; color: #00d2ff; border: 1px solid #2c2c35; padding: 8px 15px; border-radius: 20px; outline: none; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; }

        /* Channel Container (Default Mobile: Horizontal Scroll) */
        .channel-scroll-container { 
            display: flex; 
            flex-wrap: nowrap;
            overflow-x: auto; 
            padding: 20px 15px; 
            gap: 15px; 
            background: #0b0b0f; 
            scroll-behavior: smooth; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; 
        }
        .channel-scroll-container::-webkit-scrollbar { display: none; } 

        .channel-card { 
            flex: 0 0 auto; 
            width: 140px; 
            background: #1a1a21; 
            border-radius: 12px; 
            padding: 10px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            transition: all 0.3s ease; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            outline: none;
        }
        .channel-card:active { transform: scale(0.95); }
        .channel-card.active { border-color: #00d2ff; background: #22222a; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        .channel-card img { width: 100%; height: 75px; object-fit: contain; background: #ffffff; border-radius: 8px; margin-bottom: 10px; padding: 4px;}
        .channel-card p { font-size: 14px; text-align: center; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; color: #e0e0e0; font-weight: bold; }

        /* Ads Container & App Download */
        .ad-container { width: 100%; display: none; justify-content: center; align-items: center; margin: 10px 0; min-height: 60px; overflow: hidden; background: #0f0f13; }
        .app-download-btn {
            display: none; background: linear-gradient(90deg, #9b59b6, #3498db); color: white; text-align: center;
            padding: 18px; margin: 20px; border-radius: 12px; font-size: 18px; font-weight: bold; text-decoration: none;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4); animation: pulse 2s infinite; outline: none;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* ============================================================
           RESPONSIVE CSS (Mobile, Tablet, Desktop & TV)
           ============================================================ */
        @media (max-width: 600px) {
            .navbar { justify-content: center; }
            .logo-time-container { width: 100%; justify-content: space-between; }
            .search-container { max-width: 100%; width: 100%; margin-top: 10px; }
            .channel-card { width: 120px; }
            .channel-card img { height: 65px; }
            .realtime-clock { font-size: 11px; padding: 4px 8px; }
            .play-pause-btn { width: 50px; height: 50px; }
        }
        
        @media (min-width: 1024px) { 
            /* Smart TV and Desktop: Switch to Grid Layout for perfect Remote navigation */
            .channel-scroll-container { 
                display: grid !important; 
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
                gap: 20px; 
                overflow-x: hidden; 
                padding: 30px;
            }
            .channel-card { width: 100%; padding: 15px; }
            .channel-card img { height: 90px; }
            .search-container { max-width: 350px; }
            .realtime-clock { font-size: 15px; padding: 8px 15px; }
            .app-download-btn { max-width: 600px; margin: 20px auto; display: block; }
        }
    </style>
</head>

    <script>
        // --- 1. Real-Time Clock ---
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('clock-display').innerText = '🕒 ' + now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000); updateClock();

        // --- 2. Smart TV Remote Logic ---
        document.addEventListener('keydown', function(e) {
            // Show controls on any key press (useful for TV)
            if(e.key.includes("Arrow") || e.key === "Enter") {
                if (typeof showControls === 'function') showControls();
            }

            // Execute click if "Enter" is pressed on a focused element
            if (e.key === 'Enter') {
                const activeElement = document.activeElement;
                if (activeElement.classList.contains('channel-card') || activeElement.classList.contains('control-btn') || activeElement.classList.contains('play-pause-btn')) {
                    e.preventDefault();
                    activeElement.click();
                } else if (activeElement.id === 'videoContainer' && document.getElementById('youtube-container').style.display !== 'block') {
                    e.preventDefault();
                    document.getElementById('btn-playpause').click();
                }
            }
        });

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_mBhdk9OT8vWjlWZaayqEQtfcP66HS4Q",
            authDomain: "my-digital-store-917ee.firebaseapp.com",
            databaseURL: "https://my-digital-store-917ee-default-rtdb.firebaseio.com",
            projectId: "my-digital-store-917ee",
            storageBucket: "my-digital-store-917ee.firebasestorage.app",
            messagingSenderId: "331387752425",
            appId: "1:331387752425:web:2f79fc3fd2df2f84bb4578",
            measurementId: "G-J20CK41YMD"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- Video Player Elements ---
        const video = document.getElementById('video-player');
        const videoContainer = document.getElementById('videoContainer');
        const playerControls = document.getElementById('playerControls');
        const youtubeContainer = document.getElementById('youtube-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const toastMsg = document.getElementById('toast-msg');
        
        const btnPlayPause = document.getElementById('btn-playpause');
        const iconPlay = document.getElementById('icon-play');
        const btnRewind = document.getElementById('btn-rewind');
        const btnForward = document.getElementById('btn-forward');
        const btnMute = document.getElementById('btn-mute');
        const iconVolume = document.getElementById('icon-volume');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const iconFullscreen = document.getElementById('icon-fullscreen');
        const btnLock = document.getElementById('btn-lock');
        const iconLock = document.getElementById('icon-lock');
        const btnAspect = document.getElementById('btn-aspect');
        const iconAspect = document.getElementById('icon-aspect');
        const btnPip = document.getElementById('btn-pip');
        
        video.addEventListener('playing', () => loadingOverlay.classList.add('hidden'));
        video.addEventListener('waiting', () => loadingOverlay.classList.remove('hidden'));

        let controlTimeout; let isControlsVisible = false;
        const showControls = () => { playerControls.classList.add('active'); isControlsVisible = true; resetControlTimer(); };
        const hideControls = () => { if (!video.paused && !videoContainer.classList.contains('locked')) { playerControls.classList.remove('active'); isControlsVisible = false; clearTimeout(controlTimeout); } };
        const resetControlTimer = () => { clearTimeout(controlTimeout); controlTimeout = setTimeout(() => { hideControls(); }, 4000); };

        videoContainer.addEventListener('click', (e) => {
            if(e.target.closest('.control-btn') || e.target.closest('.play-pause-btn') || e.target.closest('.progress-bar')) { showControls(); return; }
            if (isControlsVisible) hideControls(); else showControls();
        });

        // Basic Player Buttons
        btnPlayPause.addEventListener('click', (e) => {
            if(e) e.stopPropagation();
            if (video.paused) { video.play(); iconPlay.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; } 
            else { video.pause(); iconPlay.innerHTML = '<path d="M8 5v14l11-7z"/>'; showControls(); }
        });
        btnRewind.addEventListener('click', () => { video.currentTime -= 10; });
        btnForward.addEventListener('click', () => { video.currentTime += 10; });
        btnMute.addEventListener('click', () => {
            video.muted = !video.muted;
            if(video.muted) iconVolume.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            else iconVolume.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        });

        // --- 3. ASPECT RATIO LOGIC (5 Icons & 5 Modes) ---
        const aspectModes = ['contain', 'cover', 'fill', 'scale-down', 'none'];
        const aspectNames = ['FIT TO SCREEN', 'ZOOM (COVER)', 'STRETCH (FILL)', 'SCALE DOWN', 'ORIGINAL SIZE'];
        
        // 5 distinct SVG icons
        const aspectIconsList = [
            '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>', // Contain (Box)
            '<path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>', // Cover (Solid Filled Box)
            '<path d="M2 5h20v14H2z M4 7h16v10H4z M9 9h6v6H9z"/>', // Stretch (Custom Wide)
            '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7V7h10v10z"/>', // Scale Down (Box inside Box)
            '<path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM10 10h4v4h-4z"/>' // None (Tiny box in middle)
        ];

        let aspectIndex = 0;
        let toastTimeout;
        const showToast = (message) => {
            toastMsg.innerText = message; toastMsg.classList.add('show');
            clearTimeout(toastTimeout); toastTimeout = setTimeout(() => toastMsg.classList.remove('show'), 2000);
        };

        btnAspect.addEventListener('click', () => {
            aspectIndex = (aspectIndex + 1) % aspectModes.length;
            video.style.objectFit = aspectModes[aspectIndex];
            
            // Change Icon
            iconAspect.innerHTML = aspectIconsList[aspectIndex];
            // Show Message
            showToast(aspectNames[aspectIndex]);
        });

        // Other Player features
        btnFullscreen.addEventListener('click', async () => {
            if (!document.fullscreenElement) {
                try { if (videoContainer.requestFullscreen) await videoContainer.requestFullscreen(); else if (videoContainer.webkitRequestFullscreen) await videoContainer.webkitRequestFullscreen(); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (err) {}
                iconFullscreen.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>'; 
            } else {
                if (document.exitFullscreen) await document.exitFullscreen(); else if (document.webkitExitFullscreen) await document.webkitExitFullscreen(); if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                iconFullscreen.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>'; 
            }
        });

        btnPip.addEventListener('click', async () => {
            try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else if (video.requestPictureInPicture) await video.requestPictureInPicture(); else if (video.webkitSetPresentationMode) video.webkitSetPresentationMode(video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture'); } catch (err) {}
        });

        let isLocked = false;
        btnLock.addEventListener('click', () => {
            isLocked = !isLocked;
            if (isLocked) { videoContainer.classList.add('locked'); iconLock.innerHTML = '<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>'; } 
            else { videoContainer.classList.remove('locked'); iconLock.innerHTML = '<path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>'; }
        });

        // Timeline
        const formatTime = (s) => { if(isNaN(s) || s === Infinity) return "LIVE"; const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60); return h > 0 ? `${h}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}` : `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`; };
        const progressBar = document.getElementById('progress-bar'), currentTimeEl = document.getElementById('current-time'), totalTimeEl = document.getElementById('total-time');
        video.addEventListener('timeupdate', () => { if (video.duration !== Infinity && !isNaN(video.duration)) { progressBar.value = (video.currentTime / video.duration) * 100; currentTimeEl.innerText = formatTime(video.currentTime); totalTimeEl.innerText = formatTime(video.duration); } else { progressBar.value = 100; currentTimeEl.innerText = "LIVE"; totalTimeEl.innerText = "LIVE"; } });
        progressBar.addEventListener('input', (e) => { if (video.duration !== Infinity && !isNaN(video.duration)) video.currentTime = (e.target.value / 100) * video.duration; });

        // --- Channel Logic ---
        function extractYouTubeID(url) { let match = url.match(/^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/); return (match && match[7].length == 11) ? match[7] : url; }

        let hls; let allChannels = []; let currentPlayingId = null;

        function playVideo(url, id, type) {
            loadingOverlay.classList.remove('hidden'); currentPlayingId = id;
            document.querySelectorAll('.channel-card').forEach(c => { c.classList.remove('active'); if(c.dataset.id === id) c.classList.add('active'); });

            if (type === 'youtube') {
                if (hls) hls.destroy(); video.pause(); video.style.display = 'none'; playerControls.style.display = 'none';
                youtubeContainer.style.display = 'block';
                youtubeContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${extractYouTubeID(url)}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
                setTimeout(() => loadingOverlay.classList.add('hidden'), 1000);
            } else {
                youtubeContainer.innerHTML = ''; youtubeContainer.style.display = 'none'; video.style.display = 'block'; playerControls.style.display = 'flex'; showControls();
                if (Hls.isSupported()) { if (hls) hls.destroy(); hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED, function () { video.play().catch(e => console.log("Blocked")); iconPlay.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }); } 
                else if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = url; video.addEventListener('loadedmetadata', function () { video.play().catch(e => console.log("Blocked")); iconPlay.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }); }
            }
        }

        function loadUserChannels(channels) {
            const container = document.getElementById('user-channel-list'); container.innerHTML = '';
            if(channels.length === 0) { container.innerHTML = '<p style="color: #666; width: 100%; text-align: center; padding: 20px;">No channels found.</p>'; return; }
            channels.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card'; 
                card.tabIndex = "0"; // Focus for TV remote
                if(ch.id === currentPlayingId) card.classList.add('active');
                card.dataset.id = ch.id;
                
                card.onclick = () => { playVideo(ch.url, ch.id, ch.type || 'm3u8'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                card.addEventListener('focus', () => { card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }); // TV Scroll support
                
                card.innerHTML = `<img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/150/ffffff/000000?text=TV'"><p>${ch.name}</p>`;
                container.appendChild(card);
            });
        }

        function renderChannels() {
            const q = document.getElementById('searchInput').value.toLowerCase(), c = document.getElementById('user-category-filter').value;
            loadUserChannels(allChannels.filter(ch => (ch.name.toLowerCase().includes(q)) && (c === 'all' || (ch.type || 'm3u8') === c)));
        }

        db.ref('channels').orderByChild('order').on('value', (snapshot) => {
            allChannels = []; snapshot.forEach((child) => { allChannels.push({ id: child.key, ...child.val() }); });
            renderChannels();
            if(allChannels.length > 0 && !video.src && !currentPlayingId && !youtubeContainer.innerHTML) playVideo(allChannels[0].url, allChannels[0].id, allChannels[0].type || 'm3u8');
        });

        // Settings, Notice & Ads
        db.ref('settings/notice').on('value', snap => { document.getElementById('user-notice').innerText = snap.val() || "Welcome to RK LIVE TV!"; });
        db.ref('settings/appUrl').on('value', snap => { const url = snap.val(), btn = document.getElementById('app-download-btn'); if(url && url.trim() !== "") { btn.href = url; btn.style.display = 'block'; } else btn.style.display = 'none'; });
        function injectAd(code, id) { const c = document.getElementById(id); c.innerHTML = ''; c.appendChild(document.createRange().createContextualFragment(code)); }
        db.ref('settings/ads').on('value', snap => {
            const data = snap.val(); if(!data) return;
            const b1 = document.getElementById('ad-banner-1'); if(data.banner1 && data.banner1.status === 'enabled') { b1.style.display = 'flex'; injectAd(data.banner1.code, 'ad-banner-1'); } else b1.style.display = 'none';
            const b2 = document.getElementById('ad-banner-2'); if(data.banner2 && data.banner2.status === 'enabled') { b2.style.display = 'flex'; injectAd(data.banner2.code, 'ad-banner-2'); } else b2.style.display = 'none';
            const p = document.getElementById('popup-ads-container'); p.innerHTML = ''; 
            if(data.popup1 && data.popup1.status === 'enabled') p.appendChild(document.createRange().createContextualFragment(data.popup1.code));
            if(data.popup2 && data.popup2.status === 'enabled') p.appendChild(document.createRange().createContextualFragment(data.popup2.code));
        });
    </script>
</body>
</html>
